[package]
name = "relay-signal"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "The Relay Nexus's contract: its Signal and its Emission, generated by ethos-zero from ethos/, and its name."

[features]
default = []
datom = ["dep:datom-codec"]

[dependencies]
translator-transport = { path = "../transport" }
rkyv = { workspace = true }
datom-codec = { workspace = true, optional = true }

[lints.rust]
unsafe_code = "forbid"
