[package]
name = "claude-harness-translator"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
process = { path = "../process", features = ["datom"] }
claude-harness-process = { path = "../claude-harness-process", features = ["datom"] }
transport = { path = "../transport" }
harness = { package = "harness-nexus-library", git = "https://github.com/LiGoldragon/harness-nexus-library", rev = "3613d63d0994de7841bcf6f070c83bebb0ddfa5a", features = ["datom"] }
datom-codec = { workspace = true }
protos = { workspace = true }
rustix = { workspace = true }
serde_json = { workspace = true }
signal-harness = { git = "https://github.com/LiGoldragon/signal-harness", rev = "eea28159303e9b51e4e211151aba0a3ceb686a32", features = ["datom"] }
signal-claude-prepare = { git = "https://github.com/LiGoldragon/signal-claude-prepare", rev = "1c1b040f545d4368451894e988073449b4591299", features = ["datom"] }

[lints.rust]
unsafe_code = "forbid"
