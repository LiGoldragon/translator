[package]
name = "translator"
version = "0.6.0"
rust-version = "1.89"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "nexus-configure"
path = "src/bin/nexus-configure.rs"
required-features = ["text"]

[features]
default = []
datom = ["dep:datom-codec", "dep:protos", "signal/datom"]
text = ["datom"]
unix = ["dep:libc", "dep:nix"]

[dependencies]
signal = { git = "https://github.com/LiGoldragon/signal", rev = "6d4eb74", default-features = false }
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "09a0526", optional = true }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "c93b598", optional = true }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
libc = { version = "0.2", optional = true }
nix = { version = "0.30", features = ["poll", "socket"], optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process", "fs"] }
