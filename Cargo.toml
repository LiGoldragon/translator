[package]
name = "translator"
version = "0.7.0"
rust-version = "1.89"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# The text lanes and the pair launcher every translator shares are members of
# their own, each one dependency set: the client end a CLI links, and the
# serving end a translator process links. Both take this crate from git at the
# revision the nexus crates take, so a consumer locks one revision of it.
[workspace]
members = [".", "crates/client", "crates/serving"]
resolver = "2"

[features]
default = []
datom = ["dep:datom-codec", "dep:protos", "signal/datom"]
text = ["datom"]
unix = ["dep:libc", "dep:nix", "dep:notify"]

[dependencies]
signal = { git = "https://github.com/LiGoldragon/signal", rev = "4f5cbb9", default-features = false }
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "09a0526", optional = true }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "c93b598", optional = true }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
libc = { version = "0.2", optional = true }
nix = { version = "0.30", features = ["poll", "socket"], optional = true }
# The kernel's word that a socket was made, through inotify on Linux.
notify = { version = "8.2.0", optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process", "fs"] }
