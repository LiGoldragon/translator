[package]
name = "relay-nexus"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "The Relay Nexus: it runs a program through its translator, follows a file for as long as it is asked, and keeps what the hook socket says. The proof of concept of the translator library."

[dependencies]
relay-signal = { path = "../relay-signal" }
translator-transport = { path = "../transport" }

[lints.rust]
unsafe_code = "forbid"
